    <polygon points="560,300 596,58 628,58" opacity="0.07"/>
    <polygon points="560,300 660,84 684,96" opacity="0.05"/>
    <polygon points="560,300 470,96 496,76" opacity="0.05"/>
  </g>

  <!-- 神经网络 -->
  <g fill="none" stroke="#5EEAD4" stroke-opacity="0.35" stroke-width="1.6">
    <path d="M512 176 L548 140 L600 132 L640 172 L612 214 L560 224 L512 176"/>
    <path d="M548 140 L560 224"/>
    <path d="M600 132 L612 214"/>
    <path d="M640 172 L676 200"/>
    <path d="M512 176 L484 214"/>
    <path d="M612 214 L648 244"/>
  </g>
  <g fill="none" stroke="#F5B942" stroke-opacity="0.3" stroke-width="1.4">
    <path d="M560 224 L560 268"/>
    <path d="M600 132 L604 96"/>
  </g>
  <g>
    <circle cx="512" cy="176" r="17" fill="url(#le-leNodeGlow)"/><circle cx="512" cy="176" r="5" fill="#A7F3D0"/>
    <circle cx="548" cy="140" r="19" fill="url(#le-leNodeGlow)"/><circle cx="548" cy="140" r="5.5" fill="#A7F3D0"/>
    <circle cx="600" cy="132" r="20" fill="url(#le-leNodeGold)"/><circle cx="600" cy="132" r="6" fill="#FFE9B0"/>
    <circle cx="640" cy="172" r="17" fill="url(#le-leNodeGlow)"/><circle cx="640" cy="172" r="5" fill="#5EEAD4"/>
    <circle cx="612" cy="214" r="17" fill="url(#le-leNodeGlow)"/><circle cx="612" cy="214" r="5" fill="#A7F3D0"/>
    <circle cx="560" cy="224" r="18" fill="url(#le-leNodeGlow)"/><circle cx="560" cy="224" r="5.5" fill="#5EEAD4"/>
    <circle cx="484" cy="214" r="14" fill="url(#le-leNodeGlow)"/><circle cx="484" cy="214" r="4" fill="#A7F3D0"/>
    <circle cx="676" cy="200" r="14" fill="url(#le-leNodeGold)"/><circle cx="676" cy="200" r="4" fill="#FFE9B0"/>
    <circle cx="648" cy="244" r="13" fill="url(#le-leNodeGlow)"/><circle cx="648" cy="244" r="4" fill="#5EEAD4"/>
    <circle cx="560" cy="268" r="12" fill="url(#le-leNodeGlow)"/><circle cx="560" cy="268" r="3.5" fill="#A7F3D0"/>
    <circle cx="604" cy="96" r="12" fill="url(#le-leNodeGold)"/><circle cx="604" cy="96" r="3.5" fill="#FFE9B0"/>
  </g>

  <!-- 环绕轨迹 -->
  <g fill="none" stroke="#F5B942">
    <ellipse cx="572" cy="182" rx="150" ry="62" stroke-opacity="0.22" stroke-width="1.6" transform="rotate(-12 572 182)"/>
    <ellipse cx="572" cy="182" rx="184" ry="80" stroke-opacity="0.12" stroke-width="1.6" transform="rotate(-12 572 182)"/>
  </g>

  <!-- 摊开的书 -->
  <ellipse cx="560" cy="330" rx="130" ry="46" fill="url(#le-leGlowGold)" opacity="0.6"/>
  <g>
    <path d="M560 382 C500 350 450 340 408 344 L408 336 C452 332 506 342 560 372 C614 342 668 332 712 336 L712 344 C670 340 620 350 560 382 Z" fill="url(#le-leCover)"/>
    <path d="M560 372 C505 342 455 332 415 336 L415 288 C460 284 510 294 560 322 Z" fill="url(#le-lePage)"/>
    <path d="M560 372 C615 342 665 332 705 336 L705 288 C660 284 610 294 560 322 Z" fill="url(#le-lePageRight)"/>
    <path d="M560 372 L560 322" stroke="#B7A77C" stroke-opacity="0.5" stroke-width="2"/>
    <g fill="none" stroke="#8C7C52" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round">
      <path d="M440 326 C480 320 522 330 548 344"/>
      <path d="M440 306 C480 300 520 310 548 326"/>
      <path d="M680 326 C640 320 598 330 572 344"/>
      <path d="M680 306 C640 300 600 310 572 326"/>
    </g>
    <path d="M560 322 L560 370" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M415 336 C455 332 505 342 560 372" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <!-- 书页上方的光粒 -->
  <g fill="#FFE9B0">
    <circle cx="470" cy="292" r="2.6" opacity="0.7"/>
    <circle cx="520" cy="276" r="1.8" opacity="0.5"/>
    <circle cx="612" cy="284" r="2.4" opacity="0.6"/>
    <circle cx="648" cy="300" r="1.8" opacity="0.45"/>
    <circle cx="560" cy="252" r="2.2" opacity="0.55"/>
    <circle cx="430" cy="270" r="1.6" opacity="0.4"/>
    <circle cx="680" cy="264" r="1.8" opacity="0.4"/>
  </g>

  </g>

  <rect y="200" width="800" height="250" fill="url(#le-leScrim)"/>
  <rect width="800" height="450" fill="url(#le-leVignette)"/>
</svg>
