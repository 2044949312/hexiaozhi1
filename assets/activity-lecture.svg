<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="le-hxzLectureTitle le-hxzLectureDesc">
  <title id="le-hxzLectureTitle">活动封面：名师公开课 · AI 前沿</title>
  <desc id="le-hxzLectureDesc">青绿到暖金的深邃背景，右下角摊开的书本向上散发金色光晕，书页上方悬浮由光点组成的神经网络与环绕轨迹，画面留出干净暗部供叠加白色文字。</desc>
  <defs>
    <linearGradient id="le-leBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#041E1C"/>
      <stop offset="0.5" stop-color="#0B4A42"/>
      <stop offset="0.82" stop-color="#4F5A2C"/>
      <stop offset="1" stop-color="#8A5A22"/>
    </linearGradient>
    <radialGradient id="le-leGlowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5B942" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#F5B942" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="le-leGlowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="le-leNodeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="le-leNodeGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE9B0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#F5B942" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="le-leScrim" x1="0" y1="200" x2="0" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#02100F" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#02100F" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#02100F" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="le-leVignette" cx="0.52" cy="0.44" r="0.62">
      <stop offset="0.5" stop-color="#010B0A" stop-opacity="0"/>
      <stop offset="1" stop-color="#010B0A" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="le-lePage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="0.6" stop-color="#F6EFD9"/>
      <stop offset="1" stop-color="#D9CBA6"/>
    </linearGradient>
    <linearGradient id="le-lePageRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF8EA"/>
      <stop offset="0.55" stop-color="#F3EAD2"/>
      <stop offset="1" stop-color="#CDBD95"/>
    </linearGradient>
    <linearGradient id="le-leCover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C3B35"/>
      <stop offset="1" stop-color="#06211E"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#le-leBg)"/>
  <g transform="translate(46 -22)">
  <circle cx="600" cy="330" r="320" fill="url(#le-leGlowGold)" opacity="0.95"/>
  <circle cx="700" cy="130" r="230" fill="url(#le-leGlowGold)" opacity="0.5"/>
  <circle cx="150" cy="240" r="230" fill="url(#le-leGlowCyan)" opacity="0.6"/>

  <!-- 稀疏星点与光尘 -->
  <g fill="#D7F5EC">
    <circle cx="70" cy="82" r="1.8" opacity="0.45"/>
    <circle cx="196" cy="140" r="1.5" opacity="0.35"/>
    <circle cx="120" cy="316" r="1.6" opacity="0.3"/>
    <circle cx="318" cy="78" r="1.6" opacity="0.35"/>
    <circle cx="742" cy="240" r="2" opacity="0.4"/>
    <circle cx="688" cy="372" r="1.8" opacity="0.35"/>
    <circle cx="470" cy="86" r="1.4" opacity="0.3"/>
    <circle cx="360" cy="336" r="1.5" opacity="0.25"/>
  </g>
  <g fill="#F5B942">
    <circle cx="248" cy="212" r="7" fill-opacity="0.5"/>
    <circle cx="248" cy="212" r="2" opacity="0.8"/>
    <circle cx="398" cy="120" r="6" fill-opacity="0.4"/>
    <circle cx="398" cy="120" r="1.8" opacity="0.7"/>
    <circle cx="736" cy="330" r="8" fill-opacity="0.35"/>
    <circle cx="736" cy="330" r="2.2" opacity="0.7"/>
  </g>

