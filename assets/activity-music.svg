  <g transform="translate(636 150) rotate(-12)">
    <path d="M11 -4 L11 -64" fill="none" stroke="url(#mu-muNoteGold)" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="1" cy="0" rx="14" ry="10" fill="url(#mu-muNoteGold)" transform="rotate(-18 1 0)"/>
    <path d="M11 -64 C30 -58 39 -44 34 -28 C28 -40 21 -46 11 -46 Z" fill="url(#mu-muNoteGold)"/>
  </g>
  <g transform="translate(704 244) rotate(10) scale(0.82)">
    <path d="M11 -4 L11 -64" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="1" cy="0" rx="14" ry="10" fill="#FFFFFF" opacity="0.7" transform="rotate(-18 1 0)"/>
    <path d="M11 -64 C30 -58 39 -44 34 -28 C28 -40 21 -46 11 -46 Z" fill="#FFFFFF" opacity="0.7"/>
