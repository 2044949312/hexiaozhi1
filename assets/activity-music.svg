    <ellipse cx="1" cy="0" rx="14" ry="10" fill="#FFE9B0" opacity="0.6" transform="rotate(-18 1 0)"/>
    <path d="M11 -64 C30 -58 39 -44 34 -28 C28 -40 21 -46 11 -46 Z" fill="#FFE9B0" opacity="0.6"/>
  </g>

