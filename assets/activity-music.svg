<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="mu-hxzMusicTitle mu-hxzMusicDesc">
  <title id="mu-hxzMusicTitle">活动封面：校园音乐节</title>
  <desc id="mu-hxzMusicDesc">暮紫到暖橙的黄昏舞台，顶部灯架射出柔和的暖金、玫红与青色光束，右侧漂浮金色音符，底部为举起手臂的观众剪影与手机灯点，深色底部渐变便于叠加白色文字。</desc>
  <defs>
    <linearGradient id="mu-muBg" x1="0" y1="0" x2="0" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16082E"/>
      <stop offset="0.42" stop-color="#3B1456"/>
      <stop offset="0.72" stop-color="#7A2E63"/>
      <stop offset="1" stop-color="#C25F45"/>
    </linearGradient>
    <radialGradient id="mu-muGlowWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5B942" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#F5B942" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mu-muGlowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mu-muBokeh" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.4" stop-color="#FFE9B0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFE9B0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mu-muScrim" x1="0" y1="210" x2="0" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0416" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0A0416" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#0A0416" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="mu-muVignette" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0.5" stop-color="#070212" stop-opacity="0"/>
      <stop offset="1" stop-color="#070212" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="mu-muNoteGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE9B0"/>
      <stop offset="1" stop-color="#F5B942"/>
    </linearGradient>
    <filter id="mu-muBeamBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#mu-muBg)"/>
  <circle cx="400" cy="330" r="300" fill="url(#mu-muGlowPink)" opacity="0.9"/>
  <circle cx="400" cy="410" r="240" fill="url(#mu-muGlowWarm)" opacity="0.8"/>
  <circle cx="120" cy="180" r="150" fill="url(#mu-muGlowPink)" opacity="0.5"/>

  <!-- 舞台光束 -->
  <g filter="url(#mu-muBeamBlur)">
    <polygon points="368,46 392,46 300,450 214,450" fill="#F5B942" opacity="0.14"/>
    <polygon points="452,46 476,46 560,450 470,450" fill="#22D3EE" opacity="0.1"/>
    <polygon points="330,46 352,46 236,450 158,450" fill="#F472B6" opacity="0.12"/>
    <polygon points="500,46 524,46 668,450 582,450" fill="#F5B942" opacity="0.1"/>
    <polygon points="410,46 436,46 414,450 342,450" fill="#FFE9B0" opacity="0.1"/>
  </g>

  <!-- 灯架 -->
  <rect x="96" y="32" width="608" height="10" rx="5" fill="#14082A" opacity="0.9"/>
  <g stroke="#2A1247" stroke-width="2" opacity="0.8">
    <path d="M180 0 V32"/><path d="M300 0 V32"/><path d="M420 0 V32"/><path d="M540 0 V32"/><path d="M660 0 V32"/>
  </g>
  <g>
