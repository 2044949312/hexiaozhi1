    <circle cx="350" cy="44" r="16" fill="url(#mu-muGlowWarm)"/>
    <circle cx="450" cy="44" r="16" fill="url(#mu-muGlowWarm)"/>
    <circle cx="550" cy="44" r="16" fill="url(#mu-muGlowWarm)"/>
    <circle cx="650" cy="44" r="16" fill="url(#mu-muGlowWarm)"/>
    <circle cx="150" cy="44" r="4.5" fill="#FFE9B0"/>
    <circle cx="250" cy="44" r="4.5" fill="#FFE9B0"/>
    <circle cx="350" cy="44" r="4.5" fill="#FFE9B0"/>
    <circle cx="450" cy="44" r="4.5" fill="#FFE9B0"/>
    <circle cx="550" cy="44" r="4.5" fill="#FFE9B0"/>
    <circle cx="650" cy="44" r="4.5" fill="#FFE9B0"/>
  </g>

