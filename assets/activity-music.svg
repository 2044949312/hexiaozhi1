  <g>
    <circle cx="88" cy="120" r="26" fill="url(#mu-muBokeh)" opacity="0.6"/>
    <circle cx="150" cy="88" r="14" fill="url(#mu-muBokeh)" opacity="0.5"/>
    <circle cx="262" cy="120" r="10" fill="url(#mu-muBokeh)" opacity="0.35"/>
    <circle cx="734" cy="112" r="22" fill="url(#mu-muBokeh)" opacity="0.45"/>
    <circle cx="688" cy="86" r="11" fill="url(#mu-muBokeh)" opacity="0.3"/>
    <circle cx="580" cy="112" r="8" fill="url(#mu-muBokeh)" opacity="0.3"/>
    <circle cx="330" cy="168" r="7" fill="url(#mu-muBokeh)" opacity="0.25"/>
  </g>

