  <g>
    <rect y="398" width="800" height="52" fill="#1D0E38"/>
    <g fill="#1D0E38">
      <circle cx="18" cy="388" r="16"/><circle cx="62" cy="394" r="15"/><circle cx="106" cy="386" r="17"/>
      <circle cx="150" cy="392" r="15"/><circle cx="194" cy="384" r="16"/><circle cx="238" cy="392" r="15"/>
      <circle cx="282" cy="386" r="16"/><circle cx="326" cy="394" r="14"/><circle cx="370" cy="384" r="16"/>
      <circle cx="414" cy="392" r="15"/><circle cx="458" cy="386" r="16"/><circle cx="502" cy="394" r="14"/>
      <circle cx="546" cy="386" r="16"/><circle cx="590" cy="392" r="15"/><circle cx="634" cy="384" r="16"/>
      <circle cx="678" cy="392" r="15"/><circle cx="722" cy="386" r="16"/><circle cx="766" cy="394" r="15"/>
    </g>
  </g>
  <g fill="#120722">
    <rect y="428" width="800" height="22"/>
    <circle cx="42" cy="416" r="20"/><circle cx="100" cy="412" r="18"/><circle cx="158" cy="420" r="21"/>
    <circle cx="216" cy="414" r="19"/><circle cx="274" cy="420" r="20"/><circle cx="332" cy="413" r="18"/>
    <circle cx="390" cy="420" r="21"/><circle cx="448" cy="414" r="19"/><circle cx="506" cy="420" r="20"/>
    <circle cx="564" cy="413" r="18"/><circle cx="622" cy="420" r="21"/><circle cx="680" cy="414" r="19"/>
    <circle cx="738" cy="420" r="20"/><circle cx="788" cy="414" r="18"/>
  </g>

  <!-- 举起的手臂与手机灯 -->
  <g stroke="#1D0E38" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M214 398 L204 348"/>
    <path d="M446 400 L458 344"/>
    <path d="M640 400 L630 352"/>
    <path d="M704 398 L716 356"/>
  </g>
  <g fill="#1D0E38">
    <circle cx="204" cy="348" r="7"/><circle cx="458" cy="344" r="7"/>
    <circle cx="630" cy="352" r="6.5"/><circle cx="716" cy="356" r="6.5"/>
  </g>
  <g stroke="#120722" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M118 424 L108 368"/>
    <path d="M354 426 L344 362"/>
    <path d="M556 426 L566 366"/>
    <path d="M764 424 L776 370"/>
  </g>
  <g fill="#120722">
    <circle cx="108" cy="368" r="7.5"/><circle cx="344" cy="362" r="7.5"/>
    <circle cx="566" cy="366" r="7.5"/><circle cx="776" cy="370" r="7.5"/>
  </g>
  <g>
    <circle cx="108" cy="360" r="10" fill="url(#mu-muBokeh)" opacity="0.9"/>
    <circle cx="108" cy="360" r="2.6" fill="#FFE9B0"/>
    <circle cx="344" cy="354" r="10" fill="url(#mu-muBokeh)" opacity="0.9"/>
    <circle cx="344" cy="354" r="2.6" fill="#FFE9B0"/>
    <circle cx="566" cy="358" r="9" fill="url(#mu-muBokeh)" opacity="0.8"/>
    <circle cx="566" cy="358" r="2.4" fill="#FFE9B0"/>
    <circle cx="716" cy="348" r="9" fill="url(#mu-muBokeh)" opacity="0.8"/>
    <circle cx="716" cy="348" r="2.4" fill="#FFE9B0"/>
  </g>

  <!-- 飘散的光点 -->
  <g fill="#FFE9B0">
    <circle cx="90" cy="286" r="2.6" opacity="0.55"/>
    <circle cx="238" cy="250" r="2" opacity="0.4"/>
    <circle cx="330" cy="300" r="2.2" opacity="0.35"/>
    <circle cx="508" cy="286" r="2.4" opacity="0.45"/>
    <circle cx="760" cy="300" r="2.6" opacity="0.4"/>
    <circle cx="680" cy="330" r="2" opacity="0.35"/>
  </g>

  <rect y="230" width="800" height="220" fill="url(#mu-muScrim)"/>
  <rect width="800" height="450" fill="url(#mu-muVignette)"/>
</svg>
