    <ellipse cx="236" cy="284" rx="13" ry="7" fill="#F5B942" opacity="0.16"/>
    <ellipse cx="384" cy="284" rx="13" ry="7" fill="#F5B942" opacity="0.16"/>
    <path d="M286 280 Q310 302 334 280" fill="none" stroke="#5EEAD4" stroke-width="8" stroke-linecap="round"/>
    <!-- 学士帽 -->
    <path d="M222 126 Q310 96 398 126 L398 154 Q310 186 222 154 Z" fill="url(#ms-capBandGrad)"/>
    <path d="M222 126 Q310 96 398 126" fill="none" stroke="#4E7EE0" stroke-opacity="0.4" stroke-width="2"/>
    <polygon points="310,44 468,94 310,144 152,94" fill="url(#ms-capGrad)"/>
    <path d="M152 94 L310 44 L468 94" fill="none" stroke="#4E7EE0" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M152 94 L310 144 L468 94" fill="none" stroke="#081A38" stroke-opacity="0.35" stroke-width="2"/>
