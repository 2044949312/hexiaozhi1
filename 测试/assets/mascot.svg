      <rect x="-21" y="33" width="42" height="5" rx="2.5" fill="url(#ms-goldGrad)"/>
      <rect x="-27" y="-26" width="54" height="56" rx="25" fill="url(#ms-lightGrad)"/>
      <rect x="-25" y="-52" width="15" height="32" rx="7.5" fill="url(#ms-lightGrad)"/>
      <rect x="-7.5" y="-58" width="15" height="38" rx="7.5" fill="url(#ms-lightGrad)"/>
      <rect x="10" y="-52" width="15" height="32" rx="7.5" fill="url(#ms-lightGrad)"/>
      <rect x="-40" y="-12" width="16" height="34" rx="8" fill="url(#ms-lightGrad)" transform="rotate(-25 -32 5)"/>
