  <path d="M66 242 Q62 206 80 186" fill="none" stroke="#5EEAD4" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
  <circle cx="74" cy="288" r="10" fill="url(#ms-glowGold)" opacity="0.5"/>
  <circle cx="74" cy="288" r="4.5" fill="#F5B942" opacity="0.6"/>
  <path d="M96 347 C96.6 351.7 98.3 353.4 103 354 C98.3 354.6 96.6 356.3 96 361 C95.4 356.3 93.7 354.6 89 354 C93.7 353.4 95.4 351.7 96 347 Z" fill="#5EEAD4" opacity="0.85"/>
  <circle cx="560" cy="252" r="3.5" fill="#FFFFFF" opacity="0.55"/>
</svg>
