  <path d="M310 400 C310.5 405.2 312.8 407.5 318 408 C312.8 408.5 310.5 410.8 310 416 C309.5 410.8 307.2 408.5 302 408 C307.2 407.5 309.5 405.2 310 400 Z" fill="#FFFFFF" opacity="0.95"/>
  <rect x="292" y="442" width="36" height="4" rx="2" fill="#14B8A6" opacity="0.25"/>
