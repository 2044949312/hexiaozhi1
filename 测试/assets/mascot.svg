      <stop offset="1" stop-color="#16379C"/>
    </linearGradient>
    <linearGradient id="ms-headGrad" x1="168" y1="118" x2="452" y2="374" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#EAF3FF"/>
      <stop offset="1" stop-color="#C9DEF6"/>
    </linearGradient>
    <linearGradient id="ms-faceGrad" x1="200" y1="184" x2="420" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A4585"/>
      <stop offset="0.55" stop-color="#0F2A5C"/>
      <stop offset="1" stop-color="#0A1D3E"/>
