<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="560" viewBox="0 0 620 560" role="img" aria-labelledby="ms-hxzMascotTitle ms-hxzMascotDesc">
  <title id="ms-hxzMascotTitle">河小智吉祥物</title>
  <desc id="ms-hxzMascotDesc">戴学士帽的校园 AI 助手机器人「河小智」：蓝青渐变机身、暖金点缀，挥手示意，另一只手托着发光平板，周围漂浮 AI 星点光晕，背景透明。</desc>
  <defs>
    <radialGradient id="ms-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#38BDF8" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ms-glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ms-glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5B942" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F5B942" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ms-groundShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0F2A5C" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#0F2A5C" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0F2A5C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ms-bodyGrad" x1="212" y1="340" x2="410" y2="512" gradientUnits="userSpaceOnUse">
