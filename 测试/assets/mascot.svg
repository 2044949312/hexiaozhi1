    <g clip-path="url(#ms-faceClip)">
      <ellipse cx="232" cy="306" rx="92" ry="44" fill="url(#ms-glowCyan)" opacity="0.4"/>
      <ellipse cx="392" cy="300" rx="72" ry="36" fill="#38BDF8" opacity="0.18"/>
      <ellipse cx="252" cy="204" rx="64" ry="18" fill="#FFFFFF" opacity="0.07"/>
