  <path d="M474 152 A44 44 0 0 1 506 112" fill="none" stroke="#F5B942" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round"/>
  <circle cx="512" cy="136" r="12" fill="url(#ms-glowGold)" opacity="0.6"/>
  <path d="M0 -8 C0.7 -2.4 2.4 -0.7 8 0 C2.4 0.7 0.7 2.4 0 8 C-0.7 2.4 -2.4 0.7 -8 0 C-2.4 -0.7 -0.7 -2.4 0 -8 Z" transform="translate(512 136) scale(0.8)" fill="url(#ms-goldGrad)"/>
  <path d="M0 -8 C0.7 -2.4 2.4 -0.7 8 0 C2.4 0.7 0.7 2.4 0 8 C-0.7 2.4 -2.4 0.7 -8 0 C-2.4 -0.7 -0.7 -2.4 0 -8 Z" fill="url(#ms-goldGrad)" transform="translate(44 144) scale(1.35)"/>
