      <rect x="-46" y="-40" width="92" height="80" rx="13" fill="url(#ms-screenGrad)"/>
      <ellipse cx="-12" cy="-20" rx="46" ry="20" fill="#FFFFFF" opacity="0.18"/>
      <path d="M0 -16 C1 -5.6 5.6 -1 16 0 C5.6 1 1 5.6 0 16 C-1 5.6 -5.6 1 -16 0 C-5.6 -1 -1 -5.6 0 -16 Z" fill="#FFFFFF" opacity="0.95"/>
