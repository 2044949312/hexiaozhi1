    <path d="M310 94 C388 106 432 140 440 184" fill="none" stroke="url(#ms-goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M432 182 C424 200 426 222 436 232 C446 220 450 198 448 182 Z" fill="url(#ms-goldGrad)"/>
    <circle cx="440" cy="182" r="6" fill="#FFE9B0"/>
    <path d="M436 232 L432 252" stroke="#DE9718" stroke-width="4" stroke-linecap="round"/>
    <path d="M442 232 L446 250" stroke="#DE9718" stroke-width="4" stroke-linecap="round"/>
  </g>

